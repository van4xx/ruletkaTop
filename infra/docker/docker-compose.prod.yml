# =============================================================================
# docker-compose.prod.yml — production-shaped topology for ruletka.top
# -----------------------------------------------------------------------------
# What this gives you over the dev compose:
#   • A real 3-NODE MongoDB replica set (rs0) → genuine multi-document
#     TRANSACTIONS + automatic failover (the wallet/auth transactional paths run
#     for real here; the dev single-node fallback is NOT used).
#   • Redis with a required password.
#   • ONE API instance behind nginx by default (Socket.io fan-out via the Redis
#     adapter; nginx pins long-poll sessions with ip_hash — see
#     infra/nginx/nginx.conf). Scale out with `--scale api=2` or an `api-2`
#     service — see the SCALING note on the `api` service below. (`deploy.replicas`
#     is NOT used: `docker compose up` ignores it — that key is Swarm-only.)
#   • coturn for TURN relay.
#
# Run (from repo root):
#   cp .env.example .env   # then fill prod secrets
#   docker compose -f infra/docker/docker-compose.prod.yml up -d --build
#
# ⚠️ HARDENING (do BEFORE exposing to the internet — see PRODUCTION.md):
#   • Mongo here runs on the ISOLATED `ruletka-net` with NO published ports AND
#     with AUTHENTICATION ENABLED (`--auth --keyFile`): every client must present
#     credentials and the three RS members authenticate to each other with a
#     shared keyFile. `bootstrap.sh` generates the keyFile + a root password + a
#     least-privilege `app` password and wires them into `MONGODB_URI`. For
#     multi-host deploys add TLS on top (or use a managed RS — MongoDB Atlas) and
#     set MONGODB_URI accordingly.
#   • Terminate TLS at nginx (mount real certs); set strong secrets in .env.
#   • Consider running Mongo nodes on separate hosts/volumes for true HA.
# =============================================================================

name: ruletka-prod

x-mongo-common: &mongo-common
  image: mongo:7
  restart: unless-stopped
  networks: [ruletka-net]
  # Replica set with AUTH ENABLED:
  #   --auth     → require client authentication (closes the unauthenticated
  #                replica set; only credentialed clients can read/write).
  #   --keyFile  → shared-secret INTERNAL auth so the three members trust each
  #                other (a keyFile also implies --auth). The keyfile is
  #                bind-mounted read-only; bootstrap.sh generates it
  #                (`openssl rand -base64 756`, chmod 400) and the root/app users.
  # The image entrypoint creates the root user (over loopback, via the localhost
  # exception) from MONGO_INITDB_ROOT_* on first init; mongo-init then authenticates
  # as root to rs.initiate() and create the least-privilege `app` user.
  command:
    [
      'mongod',
      '--replSet',
      'rs0',
      '--bind_ip_all',
      '--auth',
      '--keyFile',
      '/etc/mongo-keyfile',
    ]
  environment:
    MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:?set MONGO_ROOT_USERNAME in .env for prod}
    MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?set MONGO_ROOT_PASSWORD in .env for prod}
  # NOTE: each node sets its OWN `volumes:` below (data volume + the shared
  # keyFile) — a per-service `volumes:` REPLACES (does not merge with) an
  # anchored one, so the keyFile mount must be repeated per node, not put here.
  healthcheck:
    # Auth is on, so an UNauthenticated ping is rejected — but `connectionStatus`
    # (and a plain serverStatus ping) is allowed pre-auth and still proves the
    # mongod is up + answering, which is all the healthcheck needs to gate
    # mongo-init / the API. (mongo-init handles the credentialed RS init.)
    test: ['CMD', 'mongosh', '--quiet', '--eval', "db.adminCommand('ping').ok"]
    interval: 10s
    timeout: 5s
    retries: 10
    start_period: 20s

services:
  # ── MongoDB replica set (3 voting members) ─────────────────────────────────
  mongo1:
    <<: *mongo-common
    container_name: ruletka-mongo1
    volumes:
      - mongo1-data:/data/db
      - ../secrets/mongo-keyfile:/etc/mongo-keyfile:ro
  mongo2:
    <<: *mongo-common
    container_name: ruletka-mongo2
    volumes:
      - mongo2-data:/data/db
      - ../secrets/mongo-keyfile:/etc/mongo-keyfile:ro
  mongo3:
    <<: *mongo-common
    container_name: ruletka-mongo3
    volumes:
      - mongo3-data:/data/db
      - ../secrets/mongo-keyfile:/etc/mongo-keyfile:ro

  # One-shot: initialise rs0 with all three members, then ensure the
  # least-privilege `app` user exists, then exit. Idempotent — re-running is a
  # no-op once the set is initialised and the user exists.
  #
  # AUTH FLOW (with --auth --keyFile on the nodes):
  #   1. The image entrypoint already created the ROOT user on each node from
  #      MONGO_INITDB_ROOT_* (over the loopback localhost-exception) on first init.
  #   2. We authenticate to mongo1 AS ROOT and `rs.initiate()` (root has the
  #      cluster privileges the RS init needs once a user exists).
  #   3. After the primary is elected we create the `app` user, scoped to ONLY
  #      the `ruletka` db (readWrite + dbAdmin for index management) — the API
  #      connects as this least-privilege user, never as root.
  mongo-init:
    image: mongo:7
    container_name: ruletka-mongo-init
    networks: [ruletka-net]
    depends_on:
      mongo1: { condition: service_healthy }
      mongo2: { condition: service_healthy }
      mongo3: { condition: service_healthy }
    restart: 'no'
    environment:
      MONGO_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:?set MONGO_ROOT_USERNAME in .env for prod}
      MONGO_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?set MONGO_ROOT_PASSWORD in .env for prod}
      MONGO_APP_USERNAME: ${MONGO_APP_USERNAME:-app}
      MONGO_APP_PASSWORD: ${MONGO_APP_PASSWORD:?set MONGO_APP_PASSWORD in .env for prod}
    entrypoint:
      - bash
      - -c
      - |
        set -euo pipefail
        ADMIN_AUTH=(--host mongo1:27017 --quiet -u "$$MONGO_ROOT_USERNAME" -p "$$MONGO_ROOT_PASSWORD" --authenticationDatabase admin)

        echo "Initialising replica set rs0…"
        # rs.initiate needs auth now that the root user exists. Retry briefly in
        # case the root user creation on mongo1 is still settling at first boot.
        for i in $$(seq 1 20); do
          if mongosh "$${ADMIN_AUTH[@]}" --eval '
            try {
              rs.status();
              print("rs0 already initialised");
            } catch (e) {
              rs.initiate({
                _id: "rs0",
                members: [
                  { _id: 0, host: "mongo1:27017", priority: 2 },
                  { _id: 1, host: "mongo2:27017" },
                  { _id: 2, host: "mongo3:27017" }
                ]
              });
              print("rs0 initiated");
            }
          '; then break; fi
          echo "  …mongo1 not ready for authenticated init yet (attempt $$i) — retrying"; sleep 3
        done

        echo "Waiting for a PRIMARY before creating the app user…"
        mongosh "$${ADMIN_AUTH[@]}" --eval '
          let ok = false;
          for (let i = 0; i < 60; i++) {
            try { if (db.hello().isWritablePrimary) { ok = true; break; } } catch (e) {}
            sleep(1000);
          }
          if (!ok) { throw new Error("no PRIMARY elected in time"); }
        '

        echo "Ensuring least-privilege app user on the ruletka db…"
        mongosh "$${ADMIN_AUTH[@]}" --eval '
          const u = process.env.MONGO_APP_USERNAME;
          const p = process.env.MONGO_APP_PASSWORD;
          const adb = db.getSiblingDB("ruletka");
          if (adb.getUser(u)) {
            print("app user already exists — leaving as-is");
          } else {
            adb.createUser({
              user: u,
              pwd: p,
              // Scoped to ONLY the ruletka db. dbAdmin is needed so the API can
              // build/sync its indexes (RUN_INDEX_SYNC); no cluster/admin rights.
              roles: [ { role: "readWrite", db: "ruletka" }, { role: "dbAdmin", db: "ruletka" } ]
            });
            print("app user created");
          }
        '

  # ── Redis (password-protected) ─────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: ruletka-redis
    restart: unless-stopped
    command: ['sh', '-c', 'exec redis-server --appendonly yes --requirepass "$REDIS_PASSWORD"']
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env for prod}
    volumes: [redis-data:/data]
    networks: [ruletka-net]
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli -a "$REDIS_PASSWORD" ping | grep -q PONG']
      interval: 10s
      timeout: 5s
      retries: 5

  # ── coturn (TURN relay) ────────────────────────────────────────────────────
  coturn:
    image: coturn/coturn:4.12-alpine
    container_name: ruletka-coturn
    restart: unless-stopped
    command:
      - --static-auth-secret=$TURN_STATIC_AUTH_SECRET
      - --realm=$TURN_REALM
    environment:
      TURN_STATIC_AUTH_SECRET: ${TURN_STATIC_AUTH_SECRET:?set TURN_STATIC_AUTH_SECRET}
      TURN_REALM: ${TURN_REALM:-ruletka.top}
    ports:
      - '3478:3478/udp'
      - '3478:3478/tcp'
      - '5349:5349/tcp'
      - '49160-49200:49160-49200/udp'
    volumes:
      - ../coturn/turnserver.conf:/etc/coturn/turnserver.conf:ro
      # The Let's Encrypt cert (covers turn.ruletka.top) for the TURNS :5349
      # TLS listener — turnserver.conf points cert=/pkey= at this path.
      - letsencrypt:/etc/letsencrypt:ro
    networks: [ruletka-net]

  # ── API (SINGLE instance by default; no published ports — only nginx reaches it)
  #
  # SCALING: `docker compose up` does NOT honour `deploy.replicas` (that key is
  # Swarm-only — under plain Compose it is silently ignored). So this service runs
  # exactly ONE container, which is the intended default. To actually run a second
  # replica, EITHER:
  #   • run-time scale:  `docker compose -f infra/docker/docker-compose.prod.yml \
  #       up -d --scale api=2`. No `container_name` is set on this service, so
  #       Compose can number the instances; nginx reaches them all via the `api`
  #       DNS name (Docker DNS returns multiple A records) and the `resolver` in
  #       nginx.conf re-resolves so a dead instance is evicted. No nginx edit needed.
  #   • OR add an explicit second service `api-2:` (copy this block) AND uncomment
  #       the `server api-2:4000;` line in infra/nginx/nginx.conf.
  # Socket.io cross-node fan-out is via the Redis adapter; nginx pins long-poll
  # sessions with ip_hash (see nginx.conf).
  api:
    build:
      context: ../..
      dockerfile: infra/docker/api.Dockerfile
    restart: unless-stopped
    env_file: [../../.env]
    # node runs as PID 1 in the container. Without an init, it does NOT reap
    # zombies and (more importantly here) SIGTERM forwarding on `docker stop` /
    # redeploy is fragile. `init: true` injects a tiny PID-1 init (tini) that
    # forwards SIGTERM to node so Nest's graceful shutdown hooks fire; the longer
    # grace period gives in-flight calls / socket drains time to finish before
    # SIGKILL (default is only 10s).
    init: true
    stop_grace_period: 30s
    environment:
      NODE_ENV: production
      API_HOST: 0.0.0.0
      # All three RS members; the driver discovers the primary. Real transactions.
      # Carries the least-privilege `app` credentials + `authSource=ruletka` (the
      # db the app user lives on). Sourced from .env (bootstrap.sh builds it with
      # the generated app password) so the secret lives in exactly one place.
      # `:?` fails the deploy loudly if .env is missing it rather than silently
      # falling back to an unauthenticated string.
      MONGODB_URI: ${MONGODB_URI:?set MONGODB_URI (with app credentials) in .env for prod}
      REDIS_HOST: redis
      REDIS_PORT: '6379'
      TURN_HOST: coturn
      # Cloudflare Turnstile server secret — the anti-bot gate on /auth/register.
      # REQUIRED in production: it's a CRITICAL_SECRET in
      # apps/api/src/common/config-validation.ts (the API FAILS-FAST at boot
      # without it) and is marked REQUIRED in LAUNCH-CHECKLIST. bootstrap.sh
      # REQUIRES the operator to supply it, so .env always carries a real value.
      # `:?` fails the deploy loudly if it's somehow missing rather than silently
      # shipping with the bot gate disabled. (Pair it with the public site key
      # NEXT_PUBLIC_TURNSTILE_SITE_KEY, baked into the web build.)
      TURNSTILE_SECRET: ${TURNSTILE_SECRET:?set TURNSTILE_SECRET in .env for prod (anti-bot gate; the API refuses to boot without it)}
    depends_on:
      mongo-init: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
      coturn: { condition: service_started }
    networks: [ruletka-net]
    # NOTE: a `deploy.replicas` key was intentionally REMOVED here — `docker
    # compose up` ignores it (Swarm-only), so it falsely implied 2 running
    # replicas while exactly one ran. Use `--scale api=2` or an `api-2` service
    # to scale out (see the header comment on this service above).
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'node -e "fetch(\"http://127.0.0.1:4000/api/health\").then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"',
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s

  # ── Web (Next.js) ──────────────────────────────────────────────────────────
  web:
    build:
      context: ../..
      dockerfile: infra/docker/web.Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL}
        NEXT_PUBLIC_CLOUDPAYMENTS_PUBLIC_ID: ${NEXT_PUBLIC_CLOUDPAYMENTS_PUBLIC_ID:-}
        NEXT_PUBLIC_STUN_URLS: ${NEXT_PUBLIC_STUN_URLS}
        NEXT_PUBLIC_TURN_URLS: ${NEXT_PUBLIC_TURN_URLS}
        NEXT_PUBLIC_VAPID_PUBLIC_KEY: ${NEXT_PUBLIC_VAPID_PUBLIC_KEY:-}
        NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${NEXT_PUBLIC_TURNSTILE_SITE_KEY:-}
        NEXT_PUBLIC_SENTRY_DSN: ${NEXT_PUBLIC_SENTRY_DSN:-}
        NEXT_PUBLIC_ANALYTICS_DOMAIN: ${NEXT_PUBLIC_ANALYTICS_DOMAIN:-}
        NEXT_PUBLIC_ANALYTICS_HOST: ${NEXT_PUBLIC_ANALYTICS_HOST:-}
        NEXT_PUBLIC_ASSET_PREFIX: ${NEXT_PUBLIC_ASSET_PREFIX:-}
    restart: unless-stopped
    env_file: [../../.env]
    networks: [ruletka-net]
    depends_on:
      api: { condition: service_started }

  # ── nginx — TLS terminator + reverse proxy + Socket.io sticky LB ───────────
  nginx:
    image: nginx:1.27-alpine
    container_name: ruletka-nginx
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ../nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      # Built admin SPA (run `pnpm --filter @ruletka/admin build` first → dist/).
      - ../../apps/admin/dist:/srv/admin:ro
      # certbot-issued certs + ACME http-01 webroot (shared with the certbot svc).
      - letsencrypt:/etc/letsencrypt:ro
      - certbot-webroot:/var/www/certbot:ro
    networks: [ruletka-net]
    depends_on:
      api: { condition: service_started }
      web: { condition: service_started }

  # ── Certbot (Let's Encrypt) — auto-renews the cert covering all web subdomains
  #    (ruletka.top, www, api, admin). FIRST issuance is a manual one-shot — see
  #    DEPLOY.md. This long-running service just renews every 12h. ──
  certbot:
    image: certbot/certbot:latest
    container_name: ruletka-certbot
    restart: unless-stopped
    volumes:
      - letsencrypt:/etc/letsencrypt
      - certbot-webroot:/var/www/certbot
    entrypoint: /bin/sh -c 'trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet --deploy-hook "nginx -s reload || true"; sleep 12h & wait $${!}; done'

volumes:
  mongo1-data: { name: ruletka-mongo1-data }
  mongo2-data: { name: ruletka-mongo2-data }
  mongo3-data: { name: ruletka-mongo3-data }
  redis-data: { name: ruletka-redis-prod-data }
  letsencrypt: { name: ruletka-letsencrypt }
  certbot-webroot: { name: ruletka-certbot-webroot }

networks:
  ruletka-net:
    name: ruletka-net-prod
    driver: bridge
