# =============================================================================
# nginx — TLS terminator + reverse proxy for ruletka.top (SUBDOMAIN layout)
# -----------------------------------------------------------------------------
#   ruletka.top, www.ruletka.top   → web   (Next.js, :3000)
#   api.ruletka.top                → api   (NestJS :4000; REST /api + /socket.io)
#   admin.ruletka.top              → admin (static Vite SPA, served from disk)
#   turn.ruletka.top               → coturn directly (NOT nginx — its own UDP/TCP
#                                    ports 3478/5349; no proxy here)
#
# ⚠️ This nginx OWNS :80 and :443. The server already runs other services — if a
#    panel / web server / the mail web UI binds :443, free it first or front it
#    through this nginx (see DEPLOY.md "Coexistence").
#
# Socket.io scaling: `ip_hash` sticky on the api upstream (long-poll sessions
# must hit the same replica); cross-node fan-out is via the Redis adapter.
# =============================================================================

user  nginx;
worker_processes  auto;
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events { worker_connections 4096; }

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  server_tokens off;

  log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                  '$status $body_bytes_sent "$http_referer" "$http_user_agent"';
  access_log /var/log/nginx/access.log main;

  sendfile on; tcp_nopush on; tcp_nodelay on;
  keepalive_timeout 65; types_hash_max_size 2048;
  client_max_body_size 12m;

  gzip on; gzip_vary on; gzip_proxied any; gzip_comp_level 6; gzip_min_length 1024;
  gzip_types application/javascript application/json application/manifest+json
             application/xml font/woff2 image/svg+xml text/css text/plain text/xml;

  map $http_upgrade $connection_upgrade { default upgrade; '' close; }

  # ── Rate-limit / connection-limit zones for the realtime (Socket.io) edge ──
  # Keyed on the client IP (X-Forwarded-For's left-most is preserved by upstream
  # proxies; $binary_remote_addr is compact). These cap an unauthenticated client
  # looping Socket.io handshakes/connections from one IP — defence-in-depth in
  # front of the app's per-user, post-auth socket cap. `rate=10r/s` with burst
  # absorbs a legitimate reconnect storm (transport upgrade, tab refresh) while
  # throttling a flood; `conn` caps concurrent long-poll/WS sockets per IP.
  limit_req_zone  $binary_remote_addr zone=socketio_req:10m rate=10r/s;
  limit_conn_zone $binary_remote_addr zone=socketio_conn:10m;

  # Docker's embedded DNS resolver. Declared so name re-resolution is available
  # to any variable-based proxy_pass and (with the per-`server` failover below)
  # nginx has a working resolver in-image rather than the host's. NOTE: with the
  # STATIC `upstream` server names below, OSS nginx resolves each name once at
  # config load; the live failover that actually evicts a dead/redeployed
  # container comes from `max_fails`/`fail_timeout` + `proxy_next_upstream`
  # (below), which mark a peer DOWN on connection refusal and retry the next one.
  resolver 127.0.0.11 valid=10s ipv6=off;

  # API upstream. DEFAULT is a SINGLE `api` container (the compose ships one — see
  # docker-compose.prod.yml). `ip_hash` pins each client IP to one replica so a
  # Socket.io long-poll session always lands on the same node (cross-node fan-out
  # is via the Redis adapter). `max_fails=3 fail_timeout=10s` marks a peer DOWN
  # after 3 failures in 10s, and `proxy_next_upstream` (below) retries the next
  # peer — so a dead container is evicted instead of black-holing requests
  # (with one replica it fails fast with 502 instead of hanging on a stale IP).
  #   SCALE-OUT: bring up a second instance (`docker compose -f
  #   infra/docker/docker-compose.prod.yml --scale api=2 up -d`, or add an
  #   explicit `api-2` service) and UNCOMMENT the `server api-2:4000;` line.
  #   OBSERVABILITY: GET /api/metrics is PER-NODE (each replica has its own
  #   in-memory prom-client registry). With ≥2 replicas, scrape each replica
  #   DIRECTLY (api:4000, api-2:4000, …) — do NOT scrape /api/metrics through
  #   this ip_hash edge, which would pin Prometheus to a single replica and miss
  #   the others. See infra/README.md → "Observability".
  upstream api_backend {
    ip_hash;
    server api:4000   max_fails=3 fail_timeout=10s;
    # server api-2:4000 max_fails=3 fail_timeout=10s;   # ← uncomment when scaling to 2 replicas
    keepalive 32;
  }
  upstream web_backend { server web:3000 max_fails=3 fail_timeout=10s; keepalive 32; }

  # On a connection error / timeout / 502-504 from the chosen peer, transparently
  # retry the request against the next upstream peer (idempotent + early-stage
  # failures only). Caps avoid amplifying a slow backend into a retry storm.
  proxy_next_upstream error timeout http_502 http_503 http_504;
  proxy_next_upstream_tries 2;
  proxy_next_upstream_timeout 10s;

  proxy_http_version 1.1;
  proxy_set_header Host              $host;
  proxy_set_header X-Real-IP         $remote_addr;
  proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header X-Forwarded-Host  $host;

  # ── Shared SSL (one certbot cert with all SANs: ruletka.top www api admin) ──
  # The deploy issues a single cert at /etc/letsencrypt/live/ruletka.top/.
  ssl_protocols       TLSv1.2 TLSv1.3;
  ssl_session_cache   shared:SSL:10m;
  ssl_session_timeout 1d;
  ssl_session_tickets off;

  # ── HTTP :80 — ACME challenge + redirect to HTTPS (all hosts) ──
  server {
    listen 80; listen [::]:80;
    server_name ruletka.top www.ruletka.top api.ruletka.top admin.ruletka.top;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
  }

  # ── ruletka.top + www → web (Next.js) ──
  server {
    listen 443 ssl; listen [::]:443 ssl; http2 on;
    server_name ruletka.top www.ruletka.top;
    ssl_certificate     /etc/letsencrypt/live/ruletka.top/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ruletka.top/privkey.pem;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    # Redirect the www alias to the apex.
    if ($host = www.ruletka.top) { return 301 https://ruletka.top$request_uri; }

    # ── Immutable build assets (content-hashed) — cache hard at the browser ──
    # `/_next/static/*` filenames embed a content hash, so a 1y immutable cache
    # is safe: a new deploy ships new filenames. We replace the upstream's
    # Cache-Control rather than appending (proxy_hide_header) to avoid a dup
    # header. Still proxied to the Next server (it owns these files in the
    # standalone output) — only the caching policy is asserted here.
    location ~* ^/_next/static/ {
      proxy_pass http://web_backend;
      proxy_read_timeout 60s;
      proxy_hide_header Cache-Control;
      add_header Cache-Control "public, max-age=31536000, immutable" always;
      # Re-assert HSTS: a location-level add_header replaces the server-level one.
      add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
      # CORS: with a CDN assetPrefix (NEXT_PUBLIC_ASSET_PREFIX) the browser loads
      # these chunks cross-origin from cdn.ruletka.top — Next marks them crossorigin,
      # so they must answer CORS. Safe: build assets are public + content-hashed.
      add_header Access-Control-Allow-Origin "*" always;
    }

    # ── Static public assets + fonts/images by extension — long, revalidatable ──
    # `/public/*` (favicon, sw.js, etc.) and any static media: cache a day with a
    # week-long SWR window. NOT immutable (these names are NOT content-hashed and
    # may change in place across deploys), so a modest max-age keeps them fresh.
    # `sw.js` is excluded so the service worker is always revalidated promptly.
    location ~* ^/(?!sw\.js$).*\.(?:css|js|mjs|woff2?|ttf|otf|eot|svg|png|jpe?g|gif|webp|avif|ico)$ {
      proxy_pass http://web_backend;
      proxy_read_timeout 60s;
      proxy_hide_header Cache-Control;
      add_header Cache-Control "public, max-age=86400, stale-while-revalidate=604800" always;
      # Re-assert HSTS: a location-level add_header replaces the server-level one.
      add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
      # CORS: with a CDN assetPrefix (NEXT_PUBLIC_ASSET_PREFIX) fonts/images/css/js
      # load cross-origin from cdn.ruletka.top (Next marks crossorigin) — answer CORS.
      add_header Access-Control-Allow-Origin "*" always;
    }

    location / {
      proxy_pass http://web_backend;
      proxy_read_timeout 60s;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
    }
  }

  # ── api.ruletka.top → api (REST /api + Socket.io) ──
  server {
    listen 443 ssl; listen [::]:443 ssl; http2 on;
    server_name api.ruletka.top;
    ssl_certificate     /etc/letsencrypt/live/ruletka.top/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ruletka.top/privkey.pem;

    # Socket.io (WS upgrade + long read timeout) — must precede /api.
    location /socket.io/ {
      # Per-IP edge throttle: `burst` absorbs a legitimate reconnect/upgrade
      # burst (nodelay → no artificial queueing latency) while a flood is 429'd;
      # `limit_conn` caps concurrent sockets per IP. Defence-in-depth in front of
      # the app's per-user, post-auth socket cap — an unauthenticated client can
      # otherwise loop handshakes from one IP.
      limit_req  zone=socketio_req burst=20 nodelay;
      limit_conn socketio_conn 20;
      proxy_pass http://api_backend;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_read_timeout 3600s; proxy_send_timeout 3600s; proxy_connect_timeout 10s;
      proxy_buffering off;
    }
    # User uploads (avatars) are served by the API at /uploads/** — backstop the
    # response with nosniff so a crafted file can never be interpreted as an
    # active type by the browser, regardless of the stored Content-Type.
    location /uploads/ {
      proxy_pass http://api_backend;
      proxy_read_timeout 60s;
      add_header X-Content-Type-Options nosniff always;
    }
    # Prometheus scrape endpoint (GET /api/metrics) — DENY at the public edge.
    # It exposes internal telemetry (queue depth, live socket counts, process_*
    # series) and must never be reachable from the internet. Scrape it instead
    # over the private `ruletka-net` (a sidecar/Prometheus container hitting
    # `http://api:4000/api/metrics` directly). Defence-in-depth: the API's
    # MetricsTokenGuard ALSO fail-fasts in prod unless METRICS_TOKEN is set.
    #   `location =` is an EXACT match, so only /api/metrics is blocked (a path
    #   like /api/metrics-foo still reaches the app and its guard); `internal`
    #   makes any external hit a 404 even before the `deny all` 403.
    location = /api/metrics {
      internal;
      deny all;
    }
    location / {
      proxy_pass http://api_backend;     # global prefix "api" stays → api.ruletka.top/api/...
      proxy_read_timeout 60s;
    }
  }

  # ── admin.ruletka.top → static Vite SPA (built dist mounted at /srv/admin) ──
  server {
    listen 443 ssl; listen [::]:443 ssl; http2 on;
    server_name admin.ruletka.top;
    ssl_certificate     /etc/letsencrypt/live/ruletka.top/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ruletka.top/privkey.pem;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header X-Content-Type-Options "nosniff" always;
    # Strict static CSP backstop for the admin SPA: same-origin scripts only (no
    # inline/eval), API XHR pinned to api.ruletka.top, framing denied. The Vite
    # build emits hashed external bundles + a built CSS file, so 'self' for
    # script-src and 'unsafe-inline' for style-src only (styled-components/Vite
    # inject <style>) is sufficient; tighten style-src further if the build adopts
    # nonces.
    add_header Content-Security-Policy "default-src 'self'; frame-ancestors 'none'; connect-src 'self' https://api.ruletka.top; img-src 'self' data: https:; style-src 'self' 'unsafe-inline'; script-src 'self'; object-src 'none'; base-uri 'self'" always;

    root /srv/admin;
    location / {
      try_files $uri $uri/ /index.html;    # SPA fallback
    }
    location /assets/ {
      expires 1y;
      add_header Cache-Control "public, immutable";
    }
  }
}
