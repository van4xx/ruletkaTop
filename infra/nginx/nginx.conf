# =============================================================================
# nginx — TLS terminator + reverse proxy for ruletka.top (SUBDOMAIN layout)
# -----------------------------------------------------------------------------
#   ruletka.top, www.ruletka.top   → web   (Next.js, :3000)
#   api.ruletka.top                → api   (NestJS :4000; REST /api + /socket.io)
#   admin.ruletka.top              → admin (static Vite SPA, served from disk)
#   turn.ruletka.top               → coturn directly (NOT nginx — its own UDP/TCP
#                                    ports 3478/5349; no proxy here)
#
# ⚠️ This nginx OWNS :80 and :443. The server already runs other services — if a
#    panel / web server / the mail web UI binds :443, free it first or front it
#    through this nginx (see DEPLOY.md "Coexistence").
#
# Socket.io scaling: `ip_hash` sticky on the api upstream (long-poll sessions
# must hit the same replica); cross-node fan-out is via the Redis adapter.
# =============================================================================

user  nginx;
worker_processes  auto;
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events { worker_connections 4096; }

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  server_tokens off;

  log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                  '$status $body_bytes_sent "$http_referer" "$http_user_agent"';
  access_log /var/log/nginx/access.log main;

  sendfile on; tcp_nopush on; tcp_nodelay on;
  keepalive_timeout 65; types_hash_max_size 2048;
  client_max_body_size 12m;

  gzip on; gzip_vary on; gzip_proxied any; gzip_comp_level 6; gzip_min_length 1024;
  gzip_types application/javascript application/json application/manifest+json
             application/xml font/woff2 image/svg+xml text/css text/plain text/xml;

  map $http_upgrade $connection_upgrade { default upgrade; '' close; }

  upstream api_backend { ip_hash; server api:4000; keepalive 32; }   # add `server api-2:4000;` to scale
  upstream web_backend { server web:3000; keepalive 32; }

  proxy_http_version 1.1;
  proxy_set_header Host              $host;
  proxy_set_header X-Real-IP         $remote_addr;
  proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header X-Forwarded-Host  $host;

  # ── Shared SSL (one certbot cert with all SANs: ruletka.top www api admin) ──
  # The deploy issues a single cert at /etc/letsencrypt/live/ruletka.top/.
  ssl_protocols       TLSv1.2 TLSv1.3;
  ssl_session_cache   shared:SSL:10m;
  ssl_session_timeout 1d;
  ssl_session_tickets off;

  # ── HTTP :80 — ACME challenge + redirect to HTTPS (all hosts) ──
  server {
    listen 80; listen [::]:80;
    server_name ruletka.top www.ruletka.top api.ruletka.top admin.ruletka.top;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
  }

  # ── ruletka.top + www → web (Next.js) ──
  server {
    listen 443 ssl; listen [::]:443 ssl; http2 on;
    server_name ruletka.top www.ruletka.top;
    ssl_certificate     /etc/letsencrypt/live/ruletka.top/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ruletka.top/privkey.pem;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    # Redirect the www alias to the apex.
    if ($host = www.ruletka.top) { return 301 https://ruletka.top$request_uri; }

    location / {
      proxy_pass http://web_backend;
      proxy_read_timeout 60s;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
    }
  }

  # ── api.ruletka.top → api (REST /api + Socket.io) ──
  server {
    listen 443 ssl; listen [::]:443 ssl; http2 on;
    server_name api.ruletka.top;
    ssl_certificate     /etc/letsencrypt/live/ruletka.top/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ruletka.top/privkey.pem;

    # Socket.io (WS upgrade + long read timeout) — must precede /api.
    location /socket.io/ {
      proxy_pass http://api_backend;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_read_timeout 3600s; proxy_send_timeout 3600s; proxy_connect_timeout 10s;
      proxy_buffering off;
    }
    location / {
      proxy_pass http://api_backend;     # global prefix "api" stays → api.ruletka.top/api/...
      proxy_read_timeout 60s;
    }
  }

  # ── admin.ruletka.top → static Vite SPA (built dist mounted at /srv/admin) ──
  server {
    listen 443 ssl; listen [::]:443 ssl; http2 on;
    server_name admin.ruletka.top;
    ssl_certificate     /etc/letsencrypt/live/ruletka.top/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ruletka.top/privkey.pem;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Robots-Tag "noindex, nofollow" always;

    root /srv/admin;
    location / {
      try_files $uri $uri/ /index.html;    # SPA fallback
    }
    location /assets/ {
      expires 1y;
      add_header Cache-Control "public, immutable";
    }
  }
}
