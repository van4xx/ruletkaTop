# =============================================================================
# coturn — STUN/TURN server for ruletka.top WebRTC media relay
# =============================================================================
#
# This file is mounted read-only into the `coturn/coturn` container at
# /etc/coturn/turnserver.conf (its default config path) — see
# infra/docker/docker-compose.dev.yml.
#
# IMPORTANT: coturn does NOT perform shell-style ${VAR} interpolation inside the
# config FILE. Therefore the two values that come from the environment —
# the HMAC secret (TURN_STATIC_AUTH_SECRET) and the realm (TURN_REALM) — are
# NOT written here. Instead the compose service passes them as command-line
# flags (`--static-auth-secret=$TURN_STATIC_AUTH_SECRET --realm=$TURN_REALM`),
# which the official image's docker-entrypoint.sh expands from the container
# environment before exec'ing turnserver. coturn merges those CLI flags with
# the directives in this file. Keep secrets OUT of this file.
#
# -----------------------------------------------------------------------------
# TIME-LIMITED (REST API / "ephemeral") CREDENTIAL SCHEME
# -----------------------------------------------------------------------------
# We do NOT provision static per-user TURN passwords. Instead the NestJS API
# mints short-lived HMAC credentials on demand and hands them to the browser,
# which feeds them into `RTCPeerConnection({ iceServers: [...] })`.
#
# This is the coturn "TURN REST API" model, enabled by `use-auth-secret` +
# `static-auth-secret`. The shared secret lives ONLY on the server side
# (coturn config + API env, both reading TURN_STATIC_AUTH_SECRET). It is never
# shipped to clients.
#
# How the API mints a credential (pseudo-code — implemented in the API, NOT here):
#
#     // ttl = credential lifetime in seconds (e.g. 3600)
#     const expiry   = Math.floor(Date.now() / 1000) + ttl;
#     const username = `${expiry}:${userId}`;            // unix_ts ":" userId
#     const password = base64(hmacSHA1(TURN_STATIC_AUTH_SECRET, username));
#
#     iceServers: [
#       { urls: ['stun:TURN_HOST:3478'] },
#       {
#         urls: ['turn:TURN_HOST:3478?transport=udp',
#                'turn:TURN_HOST:3478?transport=tcp',
#                'turns:TURN_HOST:5349?transport=tcp'],
#         username,            // "1748736000:64f1a2..."
#         credential: password // base64 HMAC-SHA1 digest
#       }
#     ]
#
# How coturn validates it (automatic, because use-auth-secret is on):
#   1. Splits `username` on ':' and reads the leading unix timestamp.
#   2. Rejects the request if that timestamp is in the past (credential expired).
#   3. Recomputes base64(HMAC-SHA1(static-auth-secret, username)) and compares
#      it to the supplied `credential` in constant time.
#   4. On match, the relay allocation is granted until the timestamp elapses.
#
# Net effect: credentials are self-expiring and bound to a userId for abuse
# tracing, with zero shared TURN password state and no per-user DB writes.
# Rotating TURN_STATIC_AUTH_SECRET invalidates every outstanding credential.
# =============================================================================

# --- Listeners --------------------------------------------------------------
# Plain STUN/TURN over UDP and TCP.
listening-port=3478
# STUN/TURN over TLS (TURNS) and DTLS.
tls-listening-port=5349

# Bind on all interfaces inside the container; the host/orchestrator maps ports.
listening-ip=0.0.0.0

# In production behind NAT (cloud VM with a public IP), uncomment and set the
# public address so coturn advertises a routable relay candidate. With a
# 1:1 NAT mapping use `external-ip=PUBLIC_IP`; behind a load balancer that also
# rewrites the private address use `external-ip=PUBLIC_IP/PRIVATE_IP`.
# external-ip=PUBLIC_IP
# external-ip=PUBLIC_IP/PRIVATE_IP

# --- Relay (media) port range -----------------------------------------------
# Must exactly match the published UDP range in docker-compose
# (49160-49200/udp). Keep this range small in dev; widen for production load.
min-port=49160
max-port=49200

# --- Authentication (time-limited HMAC credentials — see header) ------------
# Enable the REST-API ephemeral-credential mechanism.
use-auth-secret
#
# NOTE: `static-auth-secret=...` and `realm=...` are intentionally NOT set here.
# They carry environment-specific / secret values and are supplied as
# command-line flags by the compose service (the entrypoint expands them from
# $TURN_STATIC_AUTH_SECRET and $TURN_REALM). See the header for the full
# rationale. Adding them here with literal ${VAR} tokens would NOT work —
# coturn does not interpolate the config file.

# --- Hardening --------------------------------------------------------------
# Append a FINGERPRINT attribute to relayed messages (WebRTC interop, integrity).
fingerprint

# Refuse relaying to multicast / broadcast peers (SSRF / amplification guard).
no-multicast-peers

# Block relaying to loopback, link-local, and RFC1918 ranges so the relay
# cannot be abused to reach internal services. Allow only public destinations.
# (Tighten/loosen for your network. The dev stack talks to public STUN peers.)
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.0.0.0-192.0.0.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=198.18.0.0-198.19.255.255

# Disable coturn's built-in telnet admin CLI (default port 5766). We never use
# it; turning it off removes an unauthenticated local control surface.
no-cli

# Reject obsolete TLS. coturn negotiates TLS1.2/1.3 only.
no-tlsv1
no-tlsv1_1

# Force clients to re-handshake on stale nonces (replay protection).
stale-nonce=600

# Per-allocation and total relay quotas (basic DoS dampening). Tune for prod.
user-quota=12
total-quota=1200

# --- TLS material -----------------------------------------------------------
# TURNS (:5349) terminates TLS with the shared Let's Encrypt cert, which the
# prod compose mounts read-only at /etc/letsencrypt (the cert SANs include
# turn.ruletka.top). Issue the cert BEFORE `docker compose up` (bootstrap.sh
# does this) — coturn won't start if the files are missing. Plain STUN/TURN on
# :3478 works regardless.
cert=/etc/letsencrypt/live/ruletka.top/fullchain.pem
pkey=/etc/letsencrypt/live/ruletka.top/privkey.pem

# --- External (public) relay address ----------------------------------------
# On a cloud VM whose public IP sits directly on the NIC (typical Timeweb VPS —
# no 1:1 NAT), coturn advertises the right relay candidate automatically, so
# this stays off. ONLY if your host is behind NAT (the public IP is NOT on the
# interface) and TURN relay fails, set the public IP here:
# external-ip=YOUR_PUBLIC_IP

# --- Logging ----------------------------------------------------------------
# Log to stdout so `docker compose logs coturn` shows everything; no log files.
log-file=stdout
simple-log
# Moderate verbosity — surfaces allocation grants/denials. Use `Verbose` (capital
# V) for packet-level tracing when debugging ICE failures; very noisy.
verbose
