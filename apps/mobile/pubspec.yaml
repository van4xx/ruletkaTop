name: ruletka
description: 'ruletka.top — random video & voice roulette, social, economy (mobile).'
publish_to: 'none'

# App version (versionName / CFBundleShortVersionString) + build number.
version: 1.0.0+1

environment:
  sdk: '>=3.11.0 <4.0.0'

# ─────────────────────────────────────────────────────────────────────────────
# Dependencies. Versions verified against pub.dev (2026-06). The FOUNDATION
# owns this file: feature agents MUST NOT edit it. If a feature truly needs a
# new package, list it in your summary for the integrator to add here.
# ─────────────────────────────────────────────────────────────────────────────
dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management + dependency injection.
  flutter_riverpod: ^3.3.1

  # Routing + auth-redirect guard.
  go_router: ^17.2.3

  # REST client.
  dio: ^5.9.2

  # Secure token storage (refresh token at rest; access token stays in memory).
  flutter_secure_storage: ^10.3.1

  # Lightweight key-value prefs (e.g. the first-launch intro preloader "seen"
  # flag, persisted so the neon intro plays ONCE per install).
  shared_preferences: ^2.3.2

  # Realtime (matchmaking, signaling, presence, chat, calls, notifications).
  socket_io_client: ^3.1.4

  # WebRTC for the video/voice roulette.
  flutter_webrtc: ^1.4.1

  # Camera/mic runtime permissions.
  permission_handler: ^12.0.2

  # Remote image caching (avatars, gifts, top feed).
  cached_network_image: ^3.4.1

  # Display + body typefaces (Unbounded + Manrope). The .ttf weights are BUNDLED
  # under assets/fonts/ and runtime fetching is disabled in main.dart
  # (GoogleFonts.config.allowRuntimeFetching = false), so type resolves from the
  # binary — no fonts.gstatic.com round-trip, no fallback-font flash/reflow, and
  # no cold-launch network dependency. See assets/fonts/README.md.
  google_fonts: ^8.1.0

  # CloudPayments widget fallback (hosted checkout) + any embedded web content.
  webview_flutter: ^4.13.1

  # Pick an avatar from the gallery / camera, then upload it (multipart) via
  # POST /profiles/me/avatar.
  image_picker: ^1.1.2

  # Multipart filename + content-type for the avatar upload.
  http_parser: ^4.1.2

  # ── On-device NSFW screening (web parity) ───────────────────────────────────
  # TensorFlow Lite interpreter for the on-device NSFW classifier — mirrors the
  # web client running nsfwjs/MobileNetV2 entirely on-device (frames never leave
  # the phone for classification). The classifier degrades gracefully: WITHOUT
  # the model asset (assets/models/nsfw.tflite — an operator-provisioned binary,
  # NOT in the repo) it falls back to the no-op and screening stays inert, so the
  # app builds + boots + runs fine. See features/roulette/data/nsfw_classifier.dart
  # and assets/models/README.md.
  tflite_flutter: ^0.12.1

  # JPEG decode + resize for the classifier (captured frames are JPEG bytes from
  # MediaStreamTrack.captureFrame(); the model wants a 224×224 RGB input).
  image: ^4.8.0

  # Open the Terms / Privacy legal pages (register consent) in the browser.
  url_launcher: ^6.3.1

  # Date/number formatting + relative timestamps.
  intl: ^0.20.2

  # ── Push notifications (FCM / APNs) ─────────────────────────────────────────
  # Native push via Firebase Cloud Messaging (FCM on Android, APNs-via-FCM on
  # iOS). The app still boots + runs WITHOUT the platform config files (init is
  # guarded; PushService falls back to the keyless no-op — see core/push/). Real
  # push additionally requires the config files as an OPS step (NOT in the repo):
  #   android/app/google-services.json  +  the google-services Gradle plugin
  #   ios/Runner/GoogleService-Info.plist  +  APNs key in the Firebase console
  firebase_core: ^4.1.0
  firebase_messaging: ^16.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  # ── Bundled typefaces (Unbounded + Manrope) ────────────────────────────────
  # google_fonts resolves these from the bundle (allowRuntimeFetching=false in
  # main.dart) by matching the family name it generates (`Unbounded`/`Manrope`).
  # Both are single VARIABLE .ttf files (a `wght` axis); Flutter applies the
  # requested FontWeight to the axis, so one file covers every weight the type
  # system uses (Unbounded w600/700/800, Manrope w400/600/700/800). The license
  # (SIL OFL 1.1) ships alongside as OFL-*.txt. See assets/fonts/README.md.
  fonts:
    - family: Unbounded
      fonts:
        - asset: assets/fonts/Unbounded-VariableFont_wght.ttf
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope-VariableFont_wght.ttf

  # Local image assets (logos, illustrations) live here.
  assets:
    - assets/images/
    # On-device NSFW model. The directory is declared so an operator-provisioned
    # `nsfw.tflite` (see assets/models/README.md) is bundled when present; the app
    # builds + runs WITHOUT it (the classifier degrades to the no-op). Declaring a
    # directory tolerates the model being absent — a missing single-file asset
    # entry would FAIL the build.
    - assets/models/
