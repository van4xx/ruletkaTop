name: Deploy to production

# Deploys ruletka.top by running the idempotent bootstrap.sh ON THE SERVER ITSELF,
# via a SELF-HOSTED GitHub runner registered on 186.246.9.90.
#
# ── WHY self-hosted ─────────────────────────────────────────────────────────────
# GitHub's Azure-hosted runners cannot hold a reliable SSH session to this server:
# the international Azure↔Timeweb path drops the connection at a fixed ~2m23s and
# loses command output (the same lossy-path issue that broke ACME http-01). Every
# SSH-based auto-deploy therefore failed with exit 255 even though the build often
# finished server-side. A self-hosted runner removes the network from the loop —
# the job runs locally on the box, `git fetch` + `bootstrap.sh` execute directly,
# nothing crosses the bad link. The runner only needs OUTBOUND https long-poll to
# GitHub to pick up jobs (resilient, with retries).
#
# ── ONE-TIME RUNNER SETUP (run as root on the server) ───────────────────────────
#   # 1. Get a registration token: repo → Settings → Actions → Runners →
#   #    "New self-hosted runner" (Linux x64) — copy the ./config.sh token.
#   mkdir -p /opt/gh-runner && cd /opt/gh-runner
#   curl -fsSL -o actions-runner.tar.gz \
#     https://github.com/actions/runner/releases/download/v2.330.0/actions-runner-linux-x64-2.330.0.tar.gz
#   tar xzf actions-runner.tar.gz
#   # Runner can't run as root → create/login as a normal user with docker access:
#   useradd -m -G docker runner 2>/dev/null || true; chown -R runner:runner /opt/gh-runner
#   sudo -u runner ./config.sh --url https://github.com/van4xx/ruletkaTop \
#        --token <REG_TOKEN> --labels ruletka --name ruletka-prod --unattended
#   ./svc.sh install runner && ./svc.sh start          # run as a systemd service
#   # Give 'runner' passwordless sudo for the deploy dir + docker (bootstrap needs it):
#   echo 'runner ALL=(root) NOPASSWD: ALL' > /etc/sudoers.d/gh-runner
#
# After the runner shows "Idle" in Settings → Actions → Runners, re-enable the
# `push` trigger below (uncomment it) so every push to main auto-deploys.

on:
  workflow_dispatch: {}
  # Enable this once the self-hosted runner is registered (see setup notes above):
  # push:
  #   branches: [main]
  #   paths-ignore: ['**.md', 'docs/**']

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: bootstrap on server
    # Targets the self-hosted runner registered with the `ruletka` label.
    runs-on: [self-hosted, ruletka]
    timeout-minutes: 30
    steps:
      - name: Sync main + run bootstrap (locally, in /opt/ruletka)
        run: |
          set -euo pipefail
          cd /opt/ruletka
          # The server keeps its own .env (with the SMTP secret) — gitignored and
          # untouched by reset, so no secrets need to live in CI.
          sudo git fetch --depth 1 origin main
          sudo git reset --hard origin/main
          sudo bash infra/deploy/bootstrap.sh
