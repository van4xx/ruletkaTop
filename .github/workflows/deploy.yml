name: Deploy to production

# Auto-deploy ruletka.top on every push to main (and on-demand from the Actions
# tab). Public repos get unlimited Actions minutes, so this is free to run.
#
# HOW IT WORKS — detach + poll (NOT one long SSH session):
#   1. Set up SSH    — write the deploy key + a `prod` host alias.
#   2. Launch deploy — one SHORT SSH: sync main, then start bootstrap.sh fully
#                      DETACHED (`setsid`, output → deploy.log, result → a marker
#                      file), and return the SSH session immediately.
#   3. Wait          — poll the marker file over SHORT SSH connections until the
#                      build finishes; stream the tail; succeed/fail accordingly.
#
# WHY: the server has a lossy OUTBOUND path to international hosts (the same issue
# that broke ACME http-01). A single SSH session left IDLE during the multi-minute
# Docker build gets dropped at ~2m23s (exit 255) — which used to fail EVERY deploy
# even though bootstrap finished server-side. Short, frequent polls never idle long
# enough to be dropped, and the build is detached so an SSH blip can't kill it.
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#   DEPLOY_HOST     186.246.9.90
#   DEPLOY_USER     root
#   DEPLOY_SSH_KEY  the PRIVATE key (full PEM, incl. BEGIN/END) whose PUBLIC half
#                   is in the server's ~/.ssh/authorized_keys
#
# The server keeps its own .env (with the SMTP secret) — gitignored, untouched by
# `git reset`, so no app secrets need to live in CI.

on:
  push:
    branches: [main]
    # Skip deploys for docs-only changes (optional; tweak as needed).
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch: {}

# Never run two deploys at once; queue a new push behind an in-flight deploy
# instead of cancelling it mid-build.
concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
    steps:
      - name: Set up SSH
        run: |
          set -euo pipefail
          test -n "$SSH_KEY"     || { echo "::error::DEPLOY_SSH_KEY secret is empty"; exit 1; }
          test -n "$HOST"        || { echo "::error::DEPLOY_HOST secret is empty"; exit 1; }
          test -n "$DEPLOY_USER" || { echo "::error::DEPLOY_USER secret is empty"; exit 1; }

          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
          # A `prod` host alias keeps every later `ssh prod …` short + identical.
          cat > ~/.ssh/config <<EOF
          Host prod
            HostName $HOST
            User $DEPLOY_USER
            IdentityFile ~/.ssh/id_deploy
            IdentitiesOnly yes
            StrictHostKeyChecking accept-new
            ConnectTimeout 25
          EOF
          chmod 600 ~/.ssh/config

      - name: Launch deploy (detached on server)
        run: |
          set -euo pipefail
          # ONE short SSH: launch the WHOLE deploy (sync main + bootstrap) as a
          # transient systemd unit via `systemd-run --no-block`. The unit runs in
          # systemd's process tree — entirely OUTSIDE this SSH session — so SSH
          # returns in seconds regardless of how long the build (or a slow
          # server→GitHub fetch) takes. A plain `setsid … &` is NOT enough: docker's
          # children keep the SSH channel held open, so SSH waited for the whole
          # build and got dropped at ~2m23s (the server closes idle inbound SSH).
          # No `$` in the inner command → no quoting traps. The unit always writes a
          # deploy.done marker ("ok"/"fail") that the next step polls for.
          ssh prod '
            set -e
            rm -f /opt/ruletka/deploy.done /opt/ruletka/deploy.log
            systemctl reset-failed ruletka-deploy.service 2>/dev/null || true
            systemd-run --collect --no-block --unit=ruletka-deploy --setenv=HOME=/root \
              /bin/bash -lc "cd /opt/ruletka && { git fetch --depth 1 origin main && git reset --hard origin/main && bash infra/deploy/bootstrap.sh ; } > deploy.log 2>&1 && echo ok > deploy.done || echo fail > deploy.done"
            echo "Deploy launched as ruletka-deploy.service; SSH returning."
          '

      - name: Wait for deploy to finish
        run: |
          set -uo pipefail
          echo "Polling for completion over short SSH connections (build runs detached)…"
          for i in $(seq 1 80); do          # 80 × 12s ≈ 16 min ceiling
            status="$(ssh prod 'cat /opt/ruletka/deploy.done 2>/dev/null' 2>/dev/null || true)"
            if [ -n "$status" ]; then
              echo "==== bootstrap finished: $status — last 60 log lines ===="
              ssh prod 'tail -n 60 /opt/ruletka/deploy.log 2>/dev/null' 2>/dev/null || true
              if [ "$status" = "ok" ]; then echo "✅ Deploy succeeded."; exit 0; fi
              echo "::error::bootstrap reported failure — see the log tail above."
              exit 1
            fi
            if [ $((i % 5)) -eq 0 ]; then
              echo "--- still deploying (~$((i * 12))s elapsed) — recent log: ---"
              ssh prod 'tail -n 6 /opt/ruletka/deploy.log 2>/dev/null' 2>/dev/null || true
            fi
            sleep 12
          done
          echo "::error::Deploy timed out after ~16 min (build still running or stuck)."
          ssh prod 'tail -n 80 /opt/ruletka/deploy.log 2>/dev/null' 2>/dev/null || true
          exit 1
